name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Một lệnh duy nhất: đối chiếu hai bản, kiểm cú pháp, chạy TOÀN BỘ bộ kiểm thử,
      # kiểm HTTPS và kiểm gói phân phối. In "ĐỦ ĐIỀU KIỆN PHÁT HÀNH" hoặc thoát mã 1.
      # Giữ đúng một chỗ khai báo danh sách test (tests/kiem-tra-tat-ca.mjs) để CI và
      # máy cá nhân không bao giờ lệch nhau.
      - name: Cổng kiểm soát trước phát hành
        run: node tests/kiem-tra-tat-ca.mjs

  docker:
    runs-on: ubuntu-latest
    name: Docker (bản NAS)
    steps:
      - uses: actions/checkout@v4

      - name: Dựng ảnh Docker
        run: docker build -t tram-du-an:ci "Chạy trên NAS"

      - name: Chạy thử và kiểm máy chủ trả lời
        run: |
          docker run -d --name tda -p 3000:3000 tram-du-an:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/config >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/config | grep -q '"serverMode":true'
          docker rm -f tda
